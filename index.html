<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIRDCHA</title><link rel="icon" href="./bird.svg"><link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
<div class="game">
<div class="widget">
<button id="anchor" role="checkbox" aria-checked="false" aria-haspopup="dialog"><span class="box" aria-hidden="true"></span>I'm a birder</button>
<div class="brand"><img src="./bird.svg" alt="" width="32" height="32"><span>BIRDCHA</span><button id="credits">About · Credits</button></div>
</div>
<button id="reset" type="button">Reset BIRDCHA</button>
</div>
</main>
<dialog id="challenge" aria-labelledby="target">
<header><div id="prompt"></div><h1 id="target" tabindex="-1"></h1><div id="hint"></div></header>
<div id="grid"></div>
<div id="sound" hidden><button id="play">▶ &nbsp; PLAY</button><label for="answer">Enter the name of the bird you hear</label><input id="answer" autocomplete="off" spellcheck="false"></div>
<p id="feedback" role="status" hidden></p>
<div id="help" hidden></div>
<footer><button class="icon" id="reload" aria-label="Get a new challenge" title="Get a new challenge">⟳</button>
<button class="icon" id="mode" aria-label="Get an audio challenge" title="Get an audio challenge"><svg viewBox="0 0 24 24"><path d="M3 14v-3a9 9 0 0 1 18 0v7a3 3 0 0 1-3 3h-3v-9h4v-1a7 7 0 0 0-14 0v1h4v9H6a3 3 0 0 1-3-3z"/></svg></button>
<button class="icon" id="info" aria-label="Help" aria-expanded="false" title="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 10h2v7h-2zm0-4h2v2h-2z"/></svg></button>
<button id="submit">Skip</button></footer>
</dialog>
<dialog id="about"><h2>About BIRDCHA</h2><p>A bird identification game inspired by the reCAPTCHA checkbox. Made for fun. Play again by clicking the checked box.</p><p><a href="https://github.com/brianalewine/bird-captcha/blob/main/PHOTO-CREDITS.md">Photo credits</a> · <a href="https://github.com/brianalewine/bird-captcha/blob/main/AUDIO-CREDITS.md">Recording credits</a></p><form method="dialog"><button>Close</button></form></dialog>
<div class="sr" id="status" role="status"></div>
<script type="module" src="./app.js"></script>
</body></html>
